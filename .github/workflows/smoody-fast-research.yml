name: Smoody source diagnostics

on:
  push:
    branches:
      - smoody-fast-research-20260619
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostics:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Install dependencies
        run: |
          python3 --version
          python3 -m pip install --upgrade pip
          python3 -m pip install requests beautifulsoup4 selenium
          which google-chrome || which google-chrome-stable || which chromium || true

      - name: Diagnose public data sources
        run: |
          set +e
          python3 scripts/smoody_source_diagnostics.py
          status=$?
          echo "diagnostics_exit_code=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Summarize output
        if: always()
        run: |
          find research_diag_output -maxdepth 1 -type f -printf '%p %s bytes\n' | sort || true
          if [ -f research_diag_output/summary.json ]; then
            cat research_diag_output/summary.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit diagnostics to temporary branch
        if: always() && github.event_name == 'push'
        run: |
          if [ -d research_diag_output ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research_diag_output
            git commit -m "Add public source diagnostics [skip ci]" || echo "No diagnostics to commit"
            git push || true
          fi

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoody-source-diagnostics
          path: research_diag_output/
          if-no-files-found: ignore
          retention-days: 3
