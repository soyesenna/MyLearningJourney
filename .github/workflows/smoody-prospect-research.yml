name: Smoody prospect research

on:
  push:
    branches:
      - smoody-prospect-research-20260619
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Install dependencies
        run: |
          python3 --version
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas requests beautifulsoup4 lxml selenium openpyxl xlrd
          which google-chrome || which google-chrome-stable || which chromium || true

      - name: Research public Cafe24 and Naver SmartStore prospects
        env:
          MAX_ENRICH: "1600"
          ENRICH: "1"
        run: |
          set +e
          python3 scripts/smoody_prospect_research.py
          status=$?
          echo "research_exit_code=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Summarize output
        if: always()
        run: |
          find research_output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort || true
          if [ -f research_output/stats.json ]; then
            cat research_output/stats.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit research output to this temporary branch
        if: always() && github.event_name == 'push'
        run: |
          if [ -d research_output ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research_output/prospects.csv research_output/prospects.json research_output/stats.json 2>/dev/null || true
            git commit -m "Add Smoody prospect research output [skip ci]" || echo "No research output to commit"
            git push || true
          fi

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoody-prospect-research
          path: research_output/
          if-no-files-found: ignore
          retention-days: 3
